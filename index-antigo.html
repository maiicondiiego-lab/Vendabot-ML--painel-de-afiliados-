<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VendaBot ML — Teste</title><style>body{font:16px Arial;background:#f3f4f6;margin:0;color:#222}header{background:#ffe600;padding:20px}main{max-width:650px;margin:auto;padding:16px}section{background:white;border-radius:12px;padding:16px;margin:12px 0}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;font:inherit;border:1px solid #ccc;border-radius:8px}button{background:#3483fa;color:white;border:0}textarea{height:150px}small{color:#555}</style><header><h1>🤖 VendaBot ML 2</h1>Modo simulado — nenhuma publicação real</header><main><section><label>Produto de teste<select id="p"></select></label><p id="info"></p><label>Link de afiliado (opcional)<input id="link" type="url" placeholder="https://..."></label><button id="gen">Gerar rascunho</button><textarea id="ad" readonly></textarea><button id="queue">Aprovar e simular publicação</button><p id="status" role="status"></p></section><section><h2>Fila simulada</h2><div id="log">Nenhum anúncio.</div></section><section><h2>Testes internos</h2><button id="test">Executar testes</button><pre id="results"></pre><small>Valores fictícios. Sem acesso a compradores ou APIs.</small></section></main><script>
const products=[['Parafusadeira 12V',109.90,12],['Tinta para piso 18 kg',167.64,18],['Chaves Allen',38.79,12],['Kit ferramentas',38.89,12],['Chaves combinadas',58,12],['Furadeira 20V',77.36,12]];const $=id=>document.getElementById(id),money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const commission=(p)=>Math.round(p[1]*p[2])/100;function valid(s){if(!s)return true;try{const u=new URL(s);return u.protocol==='https:'&&['mercadolivre.com.br','www.mercadolivre.com.br','meli.la'].includes(u.hostname)&&!u.username&&!u.password}catch{return false}}function draft(p,l){if(!valid(l))throw Error('Link inválido');return `SIMULAÇÃO — NÃO PUBLICAR\n${p[0]}\nPreço fictício: ${money(p[1])}\nConfira condições no Mercado Livre.\n${l||'Link pendente'}\nPublicidade de afiliado.`}const seen=new Set();let current=null;products.forEach((p,i)=>$('p').add(new Option(p[0],i)));function refresh(){current=null;$('ad').value='';const p=products[$('p').value];$('info').textContent=`Preço fictício: ${money(p[1])} | Comissão estimada: ${money(commission(p))}`}$('p').onchange=refresh;$('link').oninput=()=>{current=null;$('ad').value=''};refresh();$('gen').onclick=()=>{try{current=draft(products[$('p').value],$('link').value.trim());$('ad').value=current;$('status').textContent='Rascunho criado.'}catch(e){current=null;$('status').textContent=e.message}};$('queue').onclick=()=>{if(!current){$('status').textContent='Gere o rascunho primeiro.';return}if(seen.has(current)){$('status').textContent='Duplicata bloqueada.';return}seen.add(current);if(seen.size===1)$('log').textContent='';const row=document.createElement('p');row.textContent=products[$('p').value][0]+' — publicação simulada';$('log').append(row);$('status').textContent='Simulação concluída. Nada enviado.'};$('test').onclick=()=>{$('results').textContent=[['Comissão',commission(products[0])===13.19],['Link externo bloqueado',!valid('https://example.com')],['Link falso bloqueado',!valid('https://mercadolivre.com.br.example.com')],['Rascunho sinalizado',draft(products[0],'').startsWith('SIMULAÇÃO')],['Catálogo',products.length===6]].map(([n,v])=>(v?'OK':'FALHA')+' — '+n).join('\n')};</script></html>
